[project]
name = "ibotix-ticketing-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.6",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "reportlab==4.4.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
    "types-openpyxl==3.1.5.20261017",
    "types-reportlab==4.4.10.20260508",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG", "C4", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
