services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ibotix
      POSTGRES_PASSWORD: ibotix
      POSTGRES_DB: ibotix
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibotix -d ibotix"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db_data:
